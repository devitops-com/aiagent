name: Dependency audit

on:
  schedule:
    - cron: "0 6 * * *"  # daily, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install pip-audit
        run: python -m pip install pip-audit

      # Audit the LOCK FILES rather than an installed environment.
      #
      # requirements.txt is literally the dependency set the installer bundles,
      # so auditing it is the question we actually care about, and it sidesteps
      # a contradiction that made this job fail on all 68 of its runs: the
      # project was installed with `-e`, `--skip-editable` then skipped it, and
      # `--strict` ("fail if dependency collection fails on any dependency")
      # turned that skip into a fatal error. The combination could never pass.
      #
      # --ignore-vuln PYSEC-2026-2447 (diskcache 5.6.3, reached via dspy):
      # pickle deserialization allows code execution for an attacker who can
      # already write to the cache directory. 5.6.3 is the latest release and
      # upstream has published no fixed version, so there is nothing to upgrade
      # to; suppressing it keeps the job meaningful for everything else. Drop
      # this flag as soon as a fixed diskcache ships.
      - name: pip-audit (runtime lock)
        run: |
          pip-audit --strict --desc -r requirements.txt \
            --ignore-vuln PYSEC-2026-2447

      - name: pip-audit (dev lock)
        run: |
          pip-audit --strict --desc -r requirements-dev.txt \
            --ignore-vuln PYSEC-2026-2447
