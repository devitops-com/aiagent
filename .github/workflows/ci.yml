name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint + types + bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no later step needs the token in .git/config

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The hash-checked dev lock (what `make dev-install` installs), then aiagent itself.
      - name: Install package (dev, from the lock)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-dev.txt
          python -m pip install --no-deps -e .

      - name: ruff
        run: ruff check src/ tests/

      - name: mypy --strict
        run: mypy src/

      - name: bandit
        run: bandit -r src/ -c pyproject.toml

  test:
    name: tests + coverage + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no later step needs the token in .git/config

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The hash-checked dev lock (what `make dev-install` installs), then aiagent itself.
      - name: Install package (dev, from the lock)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-dev.txt
          python -m pip install --no-deps -e .

      # The installer tests run startup.sh as root and on a noexec mount inside
      # unprivileged user namespaces, which Ubuntu 24.04 runners restrict through
      # AppArmor (kernel.apparmor_restrict_unprivileged_userns=1); without this
      # those tests skip. Lift the restriction on this throwaway VM only.
      - name: Allow unprivileged user namespaces (installer tests)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run tests under coverage
        run: pytest tests/ --cov=aiagent --cov-branch -p no:cacheprovider

      - name: Build wheel + sdist
        run: |
          python -m pip install build
          python -m build

      - name: Gate — skill data shipped in the wheel
        run: |
          count=$(unzip -l dist/*.whl | grep -c 'SKILL.md' || true)
          echo "SKILL.md entries in wheel: $count"
          test "$count" -ge 2 || (echo "builtin skills missing from wheel" && exit 1)

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
